<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferrofluid Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --text: #111111; --dim: #8a8a8a; --go: #0cab2c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111111; --text: #f2f2f2; --dim: #6e6e6e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.5 "Source Code Pro", ui-monospace, Menlo, monospace; text-transform: uppercase; }
  canvas { display: block; touch-action: none; }

  /* Panel: plain text on the page, numbered like lines in an editor. */
  #panel { position: fixed; top: 24px; left: 24px; width: 300px; counter-reset: ln; }
  .ln { position: relative; display: flex; justify-content: space-between; align-items: center;
    gap: 8px; min-height: 24px; padding-left: 40px; }
  .ln::before { counter-increment: ln; content: counter(ln); position: absolute; left: 0;
    width: 22px; text-align: right; color: var(--dim); font-size: 10px; }
  .dim { color: var(--dim); }
  .tag { background: var(--text); color: var(--bg); padding: 4px 8px; font-weight: 500; }
  .val { font-variant-numeric: tabular-nums; }
  #code { display: block; line-height: 1.5; padding-top: 4px; padding-bottom: 4px;
    text-transform: none; word-break: break-all; font-size: 11px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px;
    margin: 0; background: transparent; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 1px; background: var(--text); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 14px;
    margin-top: -6.5px; background: var(--text); border: 0; border-radius: 0; }
  input[type=range]::-moz-range-track { height: 1px; background: var(--text); }
  input[type=range]::-moz-range-thumb { width: 8px; height: 14px; background: var(--text); border: 0; border-radius: 0; }
  input[type=range]:focus-visible { outline: 1px dashed var(--dim); outline-offset: 2px; }

  input[type=color] { -webkit-appearance: none; appearance: none; width: 100%; height: 14px;
    padding: 0; border: 1px solid var(--text); border-radius: 0; background: none; cursor: pointer; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 0; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 0; }

  button { font: inherit; text-transform: inherit; color: var(--text); background: none;
    border: 0; border-radius: 0; padding: 4px 4px; margin: 0 -4px; cursor: pointer; }
  button:hover { background: var(--text); color: var(--bg); }
  button.on, button.on:hover { background: var(--go); color: #111111; }
  #toggle { display: none; }

  @media (max-width: 600px) {
    #panel { top: auto; bottom: 0; left: 0; right: 0; width: auto; max-height: 46vh; overflow-y: auto;
      padding: 12px 16px 16px; background: var(--bg); border-top: 1px solid var(--text); }
    #panel.collapsed .body { display: none; }
    #toggle { display: inline-block; }
  }
</style>
</head>
<body>
<div id="panel">
  <div class="ln"><span class="tag">FERROFLUID KEY</span><button id="toggle">[HIDE]</button></div>
  <div class="ln dim">SHAPE EDITOR. NO ENCRYPTION YET.</div>
  <div class="body">
    <div class="ln"></div>
    <div class="ln"><span>SPIKES</span><span class="val" id="v-count"></span></div>
    <div class="ln"><input id="count" type="range" min="1" max="64" step="1" aria-label="Spikes"></div>
    <div class="ln"><span>SPIKE LENGTH</span><span class="val" id="v-length"></span></div>
    <div class="ln"><input id="length" type="range" min="0" max="1" step="0.01" aria-label="Spike length"></div>
    <div class="ln"><span>SHARPNESS</span><span class="val" id="v-sharp"></span></div>
    <div class="ln"><input id="sharp" type="range" min="0" max="1" step="0.01" aria-label="Sharpness"></div>
    <div class="ln"><span>SPIKE WIDTH</span><span class="val" id="v-width"></span></div>
    <div class="ln"><input id="width" type="range" min="0" max="1" step="0.01" aria-label="Spike width"></div>
    <div class="ln"><span>MAGNET FOCUS</span><span class="val" id="v-focus"></span></div>
    <div class="ln"><input id="focus" type="range" min="0" max="1" step="0.01" aria-label="Magnet focus"></div>
    <div class="ln"><span>THICKNESS</span><span class="val" id="v-visc"></span></div>
    <div class="ln"><input id="visc" type="range" min="0" max="1" step="0.01" aria-label="Thickness"></div>
    <div class="ln"><span>COLOR</span><span class="val" id="v-color"></span></div>
    <div class="ln"><input id="color" type="color" aria-label="Color"></div>
    <div class="ln"></div>
    <div class="ln"><button id="magnet">[MAGNET: OFF]</button><button id="random">[RANDOMIZE]</button></div>
    <div class="ln"></div>
    <div class="ln dim">DRAG TO SPIN. MAGNET ON, THEN POINT.</div>
    <div class="ln dim" id="code"></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const MAX_SPIKES = 64;

// Shape parameters: everything that defines a user's shape. Saved in the URL hash.
const defaults = { seed: 1, count: 24, length: 0.55, sharp: 0.6, width: 0.45, focus: 0.5, visc: 0.4, color: "#15151c" };
const shape = { ...defaults, ...readHash() };

function readHash() {
  try {
    const p = new URLSearchParams(location.hash.slice(1));
    const out = {};
    for (const k of Object.keys(defaults)) {
      if (!p.has(k)) continue;
      out[k] = k === "color" ? "#" + p.get(k).replace("#", "") : Number(p.get(k));
    }
    return out;
  } catch { return {}; }
}

function writeHash() {
  const p = new URLSearchParams();
  for (const k of Object.keys(defaults)) p.set(k, k === "color" ? shape[k].slice(1) : shape[k]);
  history.replaceState(null, "", "#" + p.toString());
  document.getElementById("code").textContent = "SHAPE: " + p.toString();
}

// Small seeded random generator, so a seed always gives the same spike layout.
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Spike directions: evenly spread points on a sphere (Fibonacci), jittered by the seed.
function spikeDirections(n, seed) {
  const rand = mulberry32(seed * 9973);
  const dirs = [];
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = n === 1 ? 1 : 1 - (2 * (i + 0.5)) / n;
    const r = Math.sqrt(1 - y * y);
    const th = golden * i;
    const v = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
    v.x += (rand() - 0.5) * 0.35; v.y += (rand() - 0.5) * 0.35; v.z += (rand() - 0.5) * 0.35;
    dirs.push(v.normalize());
  }
  return dirs;
}

// --- Scene ---
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 6.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 3.5;
controls.maxDistance = 20;

const uniforms = {
  uSpikes: { value: Array.from({ length: MAX_SPIKES }, () => new THREE.Vector4()) },
  uCount: { value: 0 },
  uSharp: { value: 2 },
  uCosR: { value: 0.8 },
  uTime: { value: 0 },
  uWobble: { value: 0 },
};

const material = new THREE.MeshPhysicalMaterial({
  color: shape.color, metalness: 0.85, roughness: 0.12, clearcoat: 1, clearcoatRoughness: 0.05,
});

// Move each vertex of a sphere outward by disp(direction), and rebuild its normal
// from two nearby samples so the lighting follows the spikes.
material.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, uniforms);
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", `#include <common>
      uniform vec4 uSpikes[${MAX_SPIKES}];
      uniform int uCount;
      uniform float uSharp, uCosR, uTime, uWobble;
      float disp(vec3 d) {
        float r = 1.0 + uWobble * 0.03 * sin(5.0 * d.x + uTime * 1.3) * sin(4.0 * d.y + uTime * 1.1) * sin(6.0 * d.z + uTime * 0.9);
        for (int i = 0; i < ${MAX_SPIKES}; i++) {
          if (i >= uCount) break;
          float t = max(0.0, (dot(d, uSpikes[i].xyz) - uCosR) / (1.0 - uCosR));
          r += uSpikes[i].w * pow(t, uSharp);
        }
        return r;
      }`)
    .replace("#include <beginnormal_vertex>", `
      vec3 sd = normalize(position);
      vec3 st1 = normalize(cross(sd, abs(sd.y) < 0.99 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
      vec3 st2 = cross(sd, st1);
      vec3 sp0 = sd * disp(sd);
      vec3 sa = normalize(sd + st1 * 0.003); vec3 sp1 = sa * disp(sa);
      vec3 sb = normalize(sd + st2 * 0.003); vec3 sp2 = sb * disp(sb);
      vec3 objectNormal = normalize(cross(sp1 - sp0, sp2 - sp0));`)
    .replace("#include <begin_vertex>", "vec3 transformed = sp0;");
};

const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 96), material);
scene.add(blob);

// --- Spike dynamics: each spike is a damped spring chasing its target height ---
let dirs = [], heights = [], velocities = [];
function rebuildSpikes() {
  const old = heights;
  dirs = spikeDirections(shape.count, shape.seed);
  heights = dirs.map((_, i) => old[i] ?? 0);
  velocities = dirs.map(() => 0);
}
rebuildSpikes();

let magnetOn = false;
const magnetDir = new THREE.Vector3(0, 1, 0);
const pointer = new THREE.Vector2(0, 0.5);

function updatePointer(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
}
renderer.domElement.addEventListener("pointermove", updatePointer);
renderer.domElement.addEventListener("pointerdown", updatePointer);

function targetHeight(dir) {
  const base = shape.length * 0.9;
  if (!magnetOn) return base * 0.15;
  const facing = Math.max(0, dir.dot(magnetDir));
  const focusPow = 0.5 + shape.focus * 8;
  return base * (0.2 + 0.8 * Math.pow(facing, focusPow)) * 1.6;
}

// --- UI ---
const ids = ["count", "length", "sharp", "width", "focus", "visc"];
function syncUI() {
  for (const id of ids) {
    document.getElementById(id).value = shape[id];
    document.getElementById("v-" + id).textContent = id === "count" ? String(shape[id]).padStart(3, "0") : Number(shape[id]).toFixed(2);
  }
  document.getElementById("color").value = shape.color;
  document.getElementById("v-color").textContent = shape.color.toUpperCase();
  material.color.set(shape.color);
  uniforms.uSharp.value = 0.6 + shape.sharp * 3.4;
  uniforms.uCosR.value = Math.cos(0.12 + shape.width * 0.5);
  writeHash();
}
for (const id of ids) {
  document.getElementById(id).addEventListener("input", (e) => {
    shape[id] = Number(e.target.value);
    if (id === "count") rebuildSpikes();
    syncUI();
  });
}
document.getElementById("color").addEventListener("input", (e) => { shape.color = e.target.value; syncUI(); });

const magnetBtn = document.getElementById("magnet");
magnetBtn.addEventListener("click", () => {
  magnetOn = !magnetOn;
  magnetBtn.textContent = magnetOn ? "[MAGNET: ON]" : "[MAGNET: OFF]";
  magnetBtn.classList.toggle("on", magnetOn);
});

document.getElementById("random").addEventListener("click", () => {
  const r = Math.random;
  Object.assign(shape, {
    seed: Math.floor(r() * 1e6), count: 1 + Math.floor(r() * 63),
    length: +r().toFixed(2), sharp: +r().toFixed(2), width: +r().toFixed(2),
    focus: +r().toFixed(2), visc: +r().toFixed(2),
    color: "#" + new THREE.Color().setHSL(r(), 0.5 + r() * 0.4, 0.08 + r() * 0.3).getHexString(),
  });
  rebuildSpikes();
  syncUI();
});

const panel = document.getElementById("panel");
document.getElementById("toggle").addEventListener("click", (e) => {
  panel.classList.toggle("collapsed");
  e.target.textContent = panel.classList.contains("collapsed") ? "[SHOW]" : "[HIDE]";
});

// On a tall phone screen: back the camera off so the blob fits the width,
// and shift the view so the blob sits above the panel.
function fitView() {
  const aspect = innerWidth / innerHeight;
  camera.aspect = aspect;
  camera.position.setLength(Math.max(6.5, 5.5 / aspect));
  if (innerWidth <= 600) camera.setViewOffset(innerWidth, innerHeight, 0, innerHeight * 0.2, innerWidth, innerHeight);
  else camera.setViewOffset(innerWidth, innerHeight, -170, 0, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", fitView);
fitView();

syncUI();

// --- Loop ---
const clock = new THREE.Clock();
const ray = new THREE.Raycaster();
const tmp = new THREE.Vector3();
function step(dt) {
  uniforms.uTime.value += dt;

  // Magnet sits where the pointer ray passes closest to the blob, in the blob's own frame.
  ray.setFromCamera(pointer, camera);
  ray.ray.closestPointToPoint(new THREE.Vector3(), tmp);
  if (tmp.lengthSq() < 1e-6) tmp.copy(ray.ray.direction).negate();
  blob.worldToLocal(tmp);
  magnetDir.lerp(tmp.normalize(), 0.15).normalize();

  // Thick fluid = heavy damping, slow and smooth. Thin fluid = springy and wobbly.
  const stiffness = 60;
  const damping = 2 + shape.visc * 22;
  let motion = 0;
  for (let i = 0; i < dirs.length; i++) {
    const a = stiffness * (targetHeight(dirs[i]) - heights[i]) - damping * velocities[i];
    velocities[i] += a * dt;
    heights[i] += velocities[i] * dt;
    motion += Math.abs(velocities[i]);
    uniforms.uSpikes.value[i].set(dirs[i].x, dirs[i].y, dirs[i].z, Math.max(0, heights[i]));
  }
  uniforms.uCount.value = dirs.length;
  uniforms.uWobble.value = 0.4 + Math.min(motion / Math.max(dirs.length, 1), 2);
}

function frame() {
  step(Math.min(clock.getDelta(), 1 / 30));
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
